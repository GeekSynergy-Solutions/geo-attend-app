name: geoattend
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_dotenv: ^5.1.0
  equatable: ^2.0.3
  flutter_bloc: ^8.0.1
  bloc: ^8.0.3
  get_it: ^7.2.0
  injectable: ^2.3.2
  json_annotation: ^4.8.1
  auto_route: ^9.2.1+1
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  dio: ^5.1.1
  connectivity_plus: ^6.0.3
  either_dart: ^1.0.0
  native_shared_preferences: ^2.0.10
  flutter_secure_storage: ^9.0.0
  flutter_svg: ^2.0.7
  image_picker: ^1.0.7
  cached_network_image: ^3.3.0
  sqflite: ^2.0.3
  path: ^1.8.0
  intl_phone_field: ^3.1.0
  shimmer: ^3.0.0
  url_launcher: ^6.1.8
  file_picker: ^8.0.2
  bloc_test: ^9.1.4
  pin_code_fields: ^8.0.1
  device_preview: ^1.1.0
  share_plus: ^10.0.1
  path_provider: ^2.1.3
  permission_handler: ^11.3.1
  app_settings: ^5.1.1
  open_file: ^3.5.3
  # uni_links: ^0.5.1
  intl: ^0.19.0
  loader_overlay: ^4.0.3
  device_info_plus: ^11.1.1
  http: ^1.2.2
  http_interceptor: ^2.0.0
  geocoding: ^3.0.0
  geolocator: ^13.0.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  percent_indicator: ^4.2.4
  avatar_stack: ^2.0.0
  # open_mail_app: 

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  injectable_generator:
  json_serializable: ^6.8.0
  auto_route_generator: ^9.0.0
  build_runner: ^2.4.5
  flutter_launcher_icons: 0.14.1

flutter:
  uses-material-design: true

  assets:
    - .env/
    - asset/files/
    - asset/images/splash/png/
    - asset/images/splash/svg/
    - asset/images/auth/png/
    - asset/images/auth/svg/
    - asset/images/logo/png/
    - asset/images/logo/svg/
    - asset/images/onBoarding/png/
    - asset/images/onBoarding/svg/
    - asset/images/universal/png/
    - asset/images/universal/svg/
    - asset/images/dashboard/png/
    - asset/images/dashboard/svg/
    - asset/images/appIcon/

flutter_launcher_icons:
  android: false
  ios: true
  remove_alpha_ios: true
  image_path_ios: "asset/images/appIcon/geoattend.png"
  macos:
    generate: true
    image_path: "asset/images/appIcon/geoattend.png"
